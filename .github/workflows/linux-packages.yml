name: Build Linux Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debian:
    name: Build DEB Package
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build meson pkg-config \
            qt6-base-dev qt6-svg-dev libqt6svg6-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpipewire-0.3-dev libasound2-dev nlohmann-json3-dev \
            libva-dev libglvnd-dev libvulkan-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build project
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Install to staging directory
        run: |
          mkdir -p staging/usr
          cmake --install build --prefix "$PWD/staging/usr" --strip

      - name: Create DEB package structure
        run: |
          set -e
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.1.0")
          VERSION=${VERSION#v}
          mkdir -p deb-build/DEBIAN
          mkdir -p deb-build/usr
          cp -a staging/usr/. deb-build/usr/

          cat > deb-build/DEBIAN/control <<EOF
          Package: canvas
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Event Horizon Desktop Environment <dev@example.com>
          Homepage: https://github.com/Event-Horizon-desktop-environment/Novara-Canvas-Studio
          Description: Novara Canvas Studio - Nonlinear Video Editor
          A powerful, pro-grade nonlinear video editor with a dark, editor-grade UI.
          Features GPU acceleration, real-time playback, and professional-grade effects.
          Depends: libqt6core6, libqt6gui6, libavformat60, libavcodec60, libpipewire-0.3-0, libasound2
          EOF

          cat > deb-build/DEBIAN/postinst <<'EOF'
          #!/bin/bash
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications 2>/dev/null || true
          fi
          if command -v update-mime-database >/dev/null 2>&1; then
            update-mime-database /usr/share/mime 2>/dev/null || true
          fi
          EOF

          chmod 0755 deb-build/DEBIAN/postinst

      - name: Build DEB package
        run: |
          dpkg-deb --build deb-build "canvas_${VERSION}_amd64.deb"
          mv "canvas_${VERSION}_amd64.deb" "canvas-$(git describe --tags --always --dirty 2>/dev/null || echo 0.1.0)_amd64.deb"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvas-deb
          path: "*.deb"
          if-no-files-found: ignore

  build-fedora:
    name: Build RPM Package
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y \
            ca-certificates git cmake ninja-build meson gcc-c++ pkgconf \
            qt6-qtbase-devel qt6-qtsvg-devel \
            ffmpeg-free-devel libva-devel libglvnd-devel pipewire-devel alsa-lib-devel \
            nlohmann-json-devel vulkan-headers rpm-build
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build project
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Install to staging directory
        run: |
          mkdir -p staging/usr
          cmake --install build --prefix "$PWD/staging/usr" --strip

      - name: Create RPM spec file
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.1.0")
          VERSION=${VERSION#v}

          cat > canvas.spec <<EOF
          Name:           canvas
          Version:        ${VERSION}
          Release:        1
          Summary:        Novara Canvas Studio - Nonlinear Video Editor
          License:        MIT
          URL:            https://github.com/Event-Horizon-desktop-environment/Novara-Canvas-Studio
          BuildArch:      x86_64

          %description
          A powerful, pro-grade nonlinear video editor with a dark, editor-grade UI.
          Features GPU acceleration, real-time playback, and professional-grade effects.

          %install
          cp -r staging/usr %{buildroot}/usr

          %files
          /usr/bin/canvas
          /usr/share/*

          %post
          update-desktop-database /usr/share/applications 2>/dev/null || true
          update-mime-database /usr/share/mime 2>/dev/null || true
          EOF

      - name: Build RPM package
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp canvas.spec rpmbuild/SPECS/
          rpmbuild -bb \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "_builddir $(pwd)/staging" \
            rpmbuild/SPECS/canvas.spec
          cp rpmbuild/RPMS/x86_64/*.rpm . || true

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvas-rpm
          path: "*.rpm"
          if-no-files-found: ignore

  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel cmake ninja meson gcc pkgconf git ca-certificates \
            qt6-base qt6-svg ffmpeg pipewire alsa-lib nlohmann-json
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build project
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Package as archive
        run: |
          mkdir -p archbuild
          cp -a build archbuild/build
          tar -czf "canvas-$(git describe --tags --always --dirty 2>/dev/null || echo 0.1.0)-arch.tar.gz" -C archbuild build

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvas-arch
          path: "*.tar.gz"
          if-no-files-found: ignore

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-svg-dev libqt6svg6-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpipewire-0.3-dev libasound2-dev nlohmann-json3-dev \
            libva-dev libglvnd-dev libvulkan-dev wget desktop-file-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build project
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Download linuxdeploy tooling
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O /tmp/linuxdeploy.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" -O /tmp/linuxdeploy-plugin-qt.AppImage
          chmod +x /tmp/linuxdeploy-plugin-qt.AppImage

      - name: Prepare AppDir
        run: |
          mkdir -p appdir/usr/bin appdir/usr/share/applications
          install -m 0755 build/gui/canvas appdir/usr/bin/canvas
          install -m 0644 packaging/canvas.desktop appdir/usr/share/applications/canvas.desktop

      - name: Create AppImage
        run: |
          /tmp/linuxdeploy.AppImage --appimage-extract-and-run --appdir appdir --plugin qt --output appimage || \
          /tmp/linuxdeploy.AppImage --appimage-extract-and-run --appdir appdir --output appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvas-appimage
          path: "*.AppImage"
          if-no-files-found: ignore

  create-release:
    name: Create Release (Tags Only)
    needs: [build-debian, build-fedora, build-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          body: |
            # Novara Canvas Studio Release

            ## Packages
            - **DEB** (Debian/Ubuntu): `canvas-*_amd64.deb`
            - **RPM** (Fedora/RHEL): `canvas-*.rpm`
            - **AppImage**: `canvas-*.AppImage`

            ## Installation

            **Debian/Ubuntu:**
            ```bash
            sudo dpkg -i canvas-*_amd64.deb
            sudo apt install -f
            ```

            **Fedora/RHEL:**
            ```bash
            sudo dnf install canvas-*.rpm
            ```

            **AppImage:**
            ```bash
            chmod +x canvas-*.AppImage
            ./canvas-*.AppImage
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
